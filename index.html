<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="Trypinn — the collaborative travel workspace. One canvas for shared maps, AI place discovery, group polls, smart itineraries, and effortless expense splitting." />
  <meta name="theme-color" content="#1E3A8A" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://images.unsplash.com https://maps.googleapis.com https://maps.gstatic.com https://*.googleusercontent.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://api.openai.com; base-uri 'self'; form-action 'self';" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Trypinn" />

  <title>Trypinn — Plan the world, together</title>
  <link rel="canonical" href="https://trypinn.com/" />

  <!-- ── Open Graph / social ── -->
  <meta property="og:title" content="Trypinn — Plan the world, together" />
  <meta property="og:description"
    content="A cinematic, real-time workspace for group travel. Shared maps, AI discovery, smart itineraries, and fair expense splitting — all in one canvas." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://trypinn.com/" />
  <meta property="og:image" content="https://trypinn.com/og-image.png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:site_name" content="Trypinn" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Trypinn — Plan the world, together" />
  <meta name="twitter:description"
    content="A cinematic, real-time workspace for group travel. Shared maps, AI discovery, smart itineraries, and fair expense splitting — all in one canvas." />
  <meta name="twitter:image" content="https://trypinn.com/og-image.png" />

  <!-- ── Resource hints ── -->
  <link rel="dns-prefetch" href="https://images.unsplash.com" />
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

  <!-- ── RSS feed discovery ── -->
  <link rel="alternate" type="application/rss+xml" title="Trypinn Travel Guides" href="/rss.xml" />

  <!-- ── Self-hosted fonts (no external request, no render-blocking) ── -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/Inter-normal-0.woff2" crossorigin />
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url(/fonts/Inter-normal-0.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Instrument Serif';
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url(/fonts/InstrumentSerif-italic-1.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Instrument Serif';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(/fonts/InstrumentSerif-normal-2.woff2) format('woff2');
    }
  </style>

  <!-- Critical resource hints — Vite build will inject modulepreload links here -->
</head>

<body>
  <div id="root"><!--app-html--></div>
  <noscript>
    <div
      style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px;font-family:system-ui,sans-serif;text-align:center;color:#334155">
      <div>
        <h1 style="font-size:24px;margin-bottom:12px">Trypinn needs JavaScript</h1>
        <p>Please enable JavaScript in your browser settings to use Trypinn.</p>
      </div>
    </div>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
